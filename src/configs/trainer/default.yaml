_target_: pytorch_lightning.Trainer
max_epochs: ${data.crowd_simulator.simulator.num_train_epochs}
accelerator: gpu
devices: 1
# Parity: upstream trains in fp32 and disables TF32 via reproducibility_settings.
precision: 32-true
accumulate_grad_batches: ${data.crowd_simulator.simulator.gradient_accumulation_steps}
gradient_clip_val: null       # upstream does not clip
log_every_n_steps: 1
num_sanity_val_steps: 0
deterministic: false          # cudnn.deterministic is set by reproducibility_settings
benchmark: false
default_root_dir: ${run_dir}
