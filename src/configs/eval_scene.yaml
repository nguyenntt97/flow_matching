# Full CrowdES scene-level benchmark (utils/metrics.py::compute_metrics).
#
# Requires all three checkpoints -- emitter_pre, emitter and simulator --
# because CrowdESFramework.__init__ loads them unconditionally. Download the
# emitter pair from the upstream release tag v1.0-model:
#   https://github.com/InhwanBae/Crowd-Behavior-Generation/releases
# into checkpoints/<dataset>/emitter_pre/ and checkpoints/<dataset>/emitter/,
# and train or export the simulator into checkpoints/<dataset>/dynamics/
# (src/train.py with export.mirror_upstream=true does that for you).
defaults:
  - _self_
  - data: eth

name: eval_scene_${data.dataset.dataset_name}
seed: 0
exp_root_dir: ${repo:outputs}
run_dir: ${exp_root_dir}/${name}/${now:%Y%m%d-%H%M%S}

hydra:
  run:
    dir: ${run_dir}
  job:
    chdir: false

trials: 20                   # upstream's TRIALS; lower it only for smoke runs
scene_limit: null            # cap the number of test scenes (smoke runs)
label: CrowdES               # shows up in logs and the summary json

viz: false                   # whether to export scene simulation videos (.m4v)
viz_trials: 1                # number of trials to visualize per scene (e.g. 1)
viz_fps: 5                   # playback frame rate for output videos
viz_max_seconds: null        # cap output video duration in simulated seconds (null for full)

