# Transcribed from upstream's three-way yaml split:
#   third_party/crowdes/configs/dataset/hotel.yaml
#   third_party/crowdes/configs/model/CrowdES_hotel.yaml
#   third_party/crowdes/configs/trainer/CrowdES_trainer_*.yaml
# Verify with: python -m src.tools.diff_config hotel
defaults:
  - base
  - _self_

dataset:
  dataset_name: hotel
  dataset_family: ethucy
  # upstream raw dir for this dataset is datasets/ETH-UCY/ (absent here, and
  # unused -- see the dataset_path comment in base.yaml)
  dataset_preprocessed_path: ${repo:datasets/preprocessed/hotel}/
  dataset_fps: 25
  dataset_preprocessor: ETHUCYPreprocessor
  dataset_augmentation: [hflip, vflip, tp, rev]

crowd_emitter:
  emitter_pre:
    max_population: 128
    population_multiplier: 0.5
  emitter:
    max_num_agents_pad: 64
    window_stride: 0.2

crowd_simulator:
  simulator:
    num_train_epochs: 64
